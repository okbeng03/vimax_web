openapi: 3.0.0
info:
  title: ViMax Web 调度模式与调度管理 API
  version: 1.0.0
  description: >
    调度模式与调度管理功能的后端 API 契约。
    (A) Web 端 API：backend 暴露给 frontend 的新增端点。
    (B) 调度服务对接契约：backend 调用外部 Vimax Scheduler 的端点映射（X-API-Key 鉴权）。

servers:
  - url: http://127.0.0.1:8000

# =====================================================================
# (A) Web 端 API（backend → frontend）
# =====================================================================
paths:
  /api/projects/{project_id}/schedule-mode:
    patch:
      operationId: setScheduleMode
      summary: 开启/关闭项目调度模式
      description: >
        开启后项目进入调度模式。关闭时若存在未结束调度任务须先取消（由调用方确认）。
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule_mode]
              properties:
                schedule_mode: { type: boolean, description: true=开启调度模式 }
      responses:
        '200':
          description: 项目调度字段已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSchedule'
        '400':
          description: 关闭调度模式但存在未结束调度任务（提示需先取消）
        '503':
          description: 调度服务不可用

  /api/projects/{project_id}/schedule-status:
    get:
      operationId: getScheduleStatus
      summary: 获取项目调度状态
      description: 返回本地调度状态与调度服务侧实时统计（供"调度中"判定与模式切换约束）。
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 调度状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSchedule'

  /api/schedule/projects:
    get:
      operationId: listScheduleProjects
      summary: 调度项目列表（透传调度服务）
      description: 返回调度服务侧项目列表，按优先级排序并含任务数量统计（total/pending/success/failed）。
      responses:
        '200':
          description: 调度项目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleProject'

  /api/schedule/projects/{schedule_project_id}/tasks:
    get:
      operationId: listScheduleProjectTasks
      summary: 项目调度任务列表（透传调度服务）
      description: 返回调度服务侧某项目下的任务列表（含状态、失败原因、结果信息）。
      parameters:
        - name: schedule_project_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleTask'

  /api/schedule/projects/{schedule_project_id}/priority:
    patch:
      operationId: setScheduleProjectPriority
      summary: 置顶/调整调度项目优先级（透传调度服务）
      description: priority=1 表示置顶（最高），priority=0 表示取消置顶（未设置）。
      parameters:
        - name: schedule_project_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { type: integer, minimum: 0, maximum: 99 }
      responses:
        '200':
          description: 优先级已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: integer }
                  priority: { type: integer }
        '503':
          description: 调度服务不可用

  /api/schedule/projects/{schedule_project_id}/cancel:
    post:
      operationId: cancelScheduleProject
      summary: 取消调度项目（透传调度服务）
      description: 取消该项目下全部 QUEUED 任务（RUNNING 不受影响）。任务级取消经确认后同样调用本接口。
      parameters:
        - name: schedule_project_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
        '503':
          description: 调度服务不可用

  /api/schedule/results:
    get:
      operationId: listScheduleResults
      summary: 获取调度结果（已完成任务列表，透传调度服务）
      description: 调用调度服务 GET /api/v1/results?synced=false 获取未同步的已完成任务列表，区分 SUCCESS/FAILED。
      responses:
        '200':
          description: 已完成任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleResult'

  /api/schedule/results/sync:
    post:
      operationId: syncScheduleResults
      summary: 回传调度结果（保存到项目目录并生成 generation_result）
      description: >
        对列表中的成功任务逐个获取结果详情，调用 ComfyUI view API 拉取输出并保存到项目目录，
        落库 GenerationResult（prompt_id 去重）；失败任务标记失败原因，不生成成功结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result_ids:
                  type: array
                  items: { type: string }
                  description: 待回传的 business_task_id 列表；为空表示全部未同步结果
      responses:
        '200':
          description: 回传结果汇总
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced: { type: integer, description: 成功回传并生成 generation_result 数量 }
                  failed: { type: integer, description: 失败任务数量 }
                  skipped: { type: integer, description: 跳过（已存在/去重）数量 }

# =====================================================================
# (B) 调度服务对接契约（backend → Vimax Scheduler @ http://127.0.0.1:8001）
# =====================================================================
x-vimax-scheduler:
  base_url: "http://127.0.0.1:8001"
  auth:
    header: "X-API-Key"
    note: "除 /api/v1/health 外全部接口；未配置 API_KEY 或鉴权失败(401) 时返回明确错误"
  endpoints:
    - operation: register_task
      method: POST
      path: /api/v1/tasks
      description: 任务登记/同步（同 business_task_id 重复提交=覆盖更新；项目首次提交任务时隐式创建）
      request_body:
        business_task_id: "本地 prompt_id"
        project_id: "本地 Project.id"
        workflow: "object，从 workflow_path 读取的 workflow JSON；读取失败传 {\"name\": workflow_name}"
        project_name: "本地项目名"
        outputs_id: "日志 output_ids[0]"
        type: "comfyui"
        extend_data: "null"
    - operation: query_task
      method: GET
      path: /api/v1/tasks/{business_task_id}
      query_params: [project_id]
    - operation: retry_task
      method: POST
      path: /api/v1/tasks/{business_task_id}/retry
      query_params: [project_id]
    - operation: get_queue
      method: GET
      path: /api/v1/queue
    - operation: get_project
      method: GET
      path: /api/v1/projects/{project_id}
      description: 项目详情含 stats(total/pending/success/failed) 与 priority
    - operation: set_priority
      method: PATCH
      path: /api/v1/projects/{project_id}/priority
      request_body: { priority: "0~99，1=最高，0=未设置" }
    - operation: cancel_project
      method: POST
      path: /api/v1/projects/{project_id}/cancel
      description: 取消该项目下全部 QUEUED 任务（RUNNING 不受影响）
    - operation: list_results
      method: GET
      path: /api/v1/results
      query_params: ["synced=false"]
      description: 未同步已完成结果列表（SUCCESS/FAILED）
    - operation: get_result
      method: GET
      path: /api/v1/results/{business_task_id}
      query_params: [project_id]
      description: 单个任务结果详情（含 result.view_urls / failure_reason / has_sync）
    - operation: health
      method: GET
      path: /api/v1/health
      description: 健康检查（无需鉴权），用于调度服务可用性探测

components:
  schemas:
    ProjectSchedule:
      type: object
      properties:
        project_id: { type: integer }
        schedule_mode: { type: boolean }
        schedule_status: { type: string, enum: [idle, scheduling] }
        pending_tasks: { type: integer, description: 未结束调度任务数（本地队列 + 调度服务 stats.pending） }
        can_switch_to_execute: { type: boolean, description: 是否允许切回执行模式 }

    ScheduleProject:
      type: object
      properties:
        project_id: { type: integer, description: 调度服务项目 id }
        web_project_id: { type: integer, nullable: true, description: web 项目 id }
        name: { type: string }
        priority: { type: integer, description: 0~99，1=最高，0=未设置 }
        paused: { type: boolean }
        stats:
          type: object
          properties:
            total: { type: integer }
            pending: { type: integer }
            success: { type: integer }
            failed: { type: integer }

    ScheduleTask:
      type: object
      properties:
        business_task_id: { type: string, description: 本地 prompt_id }
        project_id: { type: integer }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCESS, FAILED] }
        failure_reason: { type: string, nullable: true }
        result_outputs: { type: object, nullable: true }
        result_view: { type: object, nullable: true, description: ComfyUI output view 信息 }
        has_sync: { type: boolean }
        retry_count: { type: integer }

    ScheduleResult:
      type: object
      properties:
        business_task_id: { type: string }
        project_id: { type: integer }
        status: { type: string, enum: [SUCCESS, FAILED] }
        workflow: { type: object, nullable: true }
        failure_reason: { type: string, nullable: true }
        result:
          type: object
          nullable: true
          description: 成功任务的结果详情（view_urls 等）
